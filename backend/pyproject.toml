[project]
name = "lattice-backend"
version = "0.1.0"
description = "Local-first academic research workbench backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlmodel>=0.0.22,<1",
  "python-multipart>=0.0.9",
  "python-frontmatter>=1.1,<2",
  "markdown-it-py>=3,<5",
  "pymupdf>=1.24,<2",
  "watchfiles>=0.24,<2",
  "httpx>=0.27,<1",
  "bibtexparser>=1.4,<2",
  "anthropic>=0.40,<1",
  "apscheduler>=3.10,<4",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends/File in defaults is the documented pattern
  "E501",   # long Chinese strings and URLs
  "RUF001", # Chinese full-width punctuation is intentional
  "RUF002",
  "RUF003",
  "SIM117", # explicit nested context managers read better in download loops
  "UP017",  # timezone.utc remains readable and py3.11 compatible
  "UP045",  # Optional[...] is used consistently in Pydantic models
  "RUF034",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
